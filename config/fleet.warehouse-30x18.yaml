  name: robot_alpha
  namespace: /robot_alpha
  initial_pose:
    x: -10.0
    y: 5.25
    yaw: 0.0
  battery_model: turtlebot3_burger
  nav2_action_name: /robot_alpha/navigate_to_pose
  nav2_params_path: simulation-c2-3-params.template.yaml
