# Dimensions are defined once. All robot approach poses use the map frame in metres.
fleet:
  name: warehouse_distributed_30x18
  map_path: warehouse:generated
  use_sim_time: true
  battery_models:
    turtlebot3_burger:
      usable_capacity_wh: 100.0
      consumption_wh_per_meter: 0.2
      idle_power_w: 2.0
      charge_power_w: 20.0
robots:
