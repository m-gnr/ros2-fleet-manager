# Warehouse acceptance profile. Physical Gazebo/costmap generation is a separate step.
fleet:
  name: warehouse_grid
  map_path: map/map.yaml
  use_sim_time: true
  battery_models:
    turtlebot3_burger:
      usable_capacity_wh: 100.0
      consumption_wh_per_meter: 0.20
      idle_power_w: 2.0
      charge_power_w: 20.0

robots:
  - id: robot_alpha
    name: robot_alpha
    namespace: /robot_alpha
    initial_pose: {x: 4.75, y: 3.25, yaw: 1.5707963267948966}
    battery_model: turtlebot3_burger
    nav2_action_name: /robot_alpha/navigate_to_pose
    nav2_params_path: simulation-c2-3-params.template.yaml
  - id: robot_beta
    name: robot_beta
    namespace: /robot_beta
    initial_pose: {x: 5.0, y: -1.75, yaw: 0.0}
    battery_model: turtlebot3_burger
    nav2_action_name: /robot_beta/navigate_to_pose
    nav2_params_path: simulation-c2-3-params.template.yaml

stations:
  charging_stations:
    - id: dock_1
      pose: {x: 4.75, y: 3.25, yaw: 1.5707963267948966}
      tolerance_radius: 0.30
    - id: dock_2
      pose: {x: 5.5, y: 3.25, yaw: 1.5707963267948966}
      tolerance_radius: 0.30
  parking_stations:
    - id: park_1
      pose: {x: 5.25, y: 1.0, yaw: 0.0}
  safe_waiting_areas: []

policies:
  assignment: priority_fifo_nearest_eligible
  preemption_priority: HIGH
  max_preemptions: 2
  extra_swap_enabled: false
  automatic_retry: false
  automatic_reassignment: false
  charge_target_soc_percent: 80
  charge_queue: lowest_soc_fifo
  emergency_soc_percent: 8.0
  low_soc_percent: 25.0
  safety_margin_wh: 10.0

warehouse:
  frame_id: map
  grid_m: 0.25
  bounds: {x_min: -6.0, x_max: 6.0, y_min: -4.0, y_max: 4.0}
  wall_thickness_m: 0.12
  wall_height_m: 1.9
  door: {side: west, center: 0.0, width: 1.5}
  racks:
    - {id: rack_a1, bays: 3, height: 1.10, bounds: {x_min: -4.0, x_max: -0.75, y_min: 2.5, y_max: 3.5}}
    - {id: rack_a2, bays: 3, height: 1.10, bounds: {x_min: 0.75, x_max: 4.0, y_min: 2.5, y_max: 3.5}}
    - {id: rack_b1, bays: 3, height: 0.90, bounds: {x_min: -4.0, x_max: -0.75, y_min: -0.75, y_max: 0.75}}
    - {id: rack_b2, bays: 3, height: 0.90, bounds: {x_min: 0.75, x_max: 4.0, y_min: -0.75, y_max: 0.75}}
    - {id: rack_c1, bays: 3, height: 0.85, bounds: {x_min: -4.0, x_max: -0.75, y_min: -3.5, y_max: -2.5}}
    - {id: rack_c2, bays: 3, height: 0.85, bounds: {x_min: 0.75, x_max: 4.0, y_min: -3.5, y_max: -2.5}}
  aisles:
    - {id: aisle_a, label: ANA KORİDOR A, axis: x, bounds: {x_min: -5.0, x_max: 4.5, y_min: 0.75, y_max: 2.5}}
    - {id: aisle_b, label: ANA KORİDOR B, axis: x, bounds: {x_min: -5.0, x_max: 4.5, y_min: -2.5, y_max: -0.75}}
    - {id: aisle_cross, label: ENİNE GEÇİT, axis: y, bounds: {x_min: -0.75, x_max: 0.75, y_min: -2.5, y_max: 2.5}}
  zones:
    - {id: pickup_zone, label: ALIM, kind: pickup, bounds: {x_min: -5.75, x_max: -4.0, y_min: -2.75, y_max: 2.75}}
    - {id: delivery_zone, label: TESLİM, kind: dropoff, bounds: {x_min: 4.0, x_max: 5.75, y_min: -3.5, y_max: -0.25}}
    - {id: charge_zone, label: ŞARJ, kind: charging, bounds: {x_min: 4.0, x_max: 6.0, y_min: 2.25, y_max: 4.0}}
    - {id: park_zone, label: PARK, kind: parking, bounds: {x_min: 4.75, x_max: 5.75, y_min: 0.25, y_max: 1.75}}
  transfer_points:
    - {id: pickup_1, kind: pickup, pose: {x: -5.0, y: 1.75, yaw: 3.141592653589793}}
    - {id: pickup_2, kind: pickup, pose: {x: -5.0, y: -1.75, yaw: 3.141592653589793}}
    - {id: delivery_1, kind: dropoff, pose: {x: 5.0, y: -1.75, yaw: 0.0}}
    - {id: delivery_2, kind: dropoff, pose: {x: 5.0, y: -3.0, yaw: 0.0}}
