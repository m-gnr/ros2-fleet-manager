name: ros2-fleet-simulation-c3-3-3

x-c3-3-3: &c3-3-3
  image: ros2-fleet-simulation-nav2-check:humble-fortress
  volumes:
    - ../../docker/simulation-common:/opt/fleet-live-validation:ro
    - ../../config:/config:ro
    - ../../config:/workspace/config:ro
    - ../../docker/simulation-c3-3-3:/opt/simulation-c3-3-3:ro
    - ../../interfaces:/workspace/src/interfaces:ro
    - ../../ros2_ws/src:/workspace/src/ros2_ws:ro
    - ../../backend:/workspace/backend:ro
    - ../../fleet_config:/workspace/fleet_config:ro
    - ../../tests:/workspace/tests:ro

services:
  simulation:
    <<: *c3-3-3
    stop_grace_period: 40s
    environment:
      SIM_CHECK_ROLE: simulation
      DDS_TEST_TIMEOUT_SECONDS: "300"
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      IGN_GAZEBO_RENDER_ENGINE_PATH: /usr/lib/aarch64-linux-gnu/ign-rendering-6/engine-plugins
      IGN_RENDERING_PLUGIN_PATH: /usr/lib/aarch64-linux-gnu/ign-rendering-6/engine-plugins
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && cd /workspace && colcon build --symlink-install --base-paths src && source install/setup.bash && export PYTHONPATH=/opt/fleet-live-validation:/workspace:/workspace/backend:/workspace/fleet_config:/workspace/src/ros2_ws/fleet_robot_executor:$$PYTHONPATH && exec python3 /opt/simulation-c3-3-3/check.py"]
  backend:
    <<: *c3-3-3
    image: ros2-fleet-simulation-c3-3-3-backend:humble-fortress
    build:
      context: ../..
      dockerfile: docker/simulation-c3-3-3/Dockerfile
    environment:
      SIM_CHECK_ROLE: backend
      C333_HIGH_PREEMPTION: "${C333_HIGH_PREEMPTION:-0}"
      C333_AUTO_ROUTES: "${C333_AUTO_ROUTES:-0}"
      C333_ENERGY_POLICY: "${C333_ENERGY_POLICY:-0}"
      DDS_TEST_TIMEOUT_SECONDS: "300"
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && cd /workspace && colcon build --symlink-install --base-paths src && source install/setup.bash && export PYTHONPATH=/workspace:/workspace/backend:/workspace/fleet_config:/workspace/src/ros2_ws/fleet_robot_executor:$$PYTHONPATH && exec python3 /opt/simulation-c3-3-3/check.py"]
