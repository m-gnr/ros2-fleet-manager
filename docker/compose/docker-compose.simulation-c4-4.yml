# Validation only. Layer after C4.3 and use the existing images.
name: ros2-fleet-simulation-c4-4

x-c4-4: &c4-4
  volumes:
    - ../../docker/simulation-c4-4:/opt/simulation-c4-4:ro
  command:
    - bash
    - -c
    - >-
      set -e;
      source /opt/ros/humble/setup.bash;
      cd /workspace;
      colcon build --base-paths src;
      source install/setup.bash;
      export PYTHONPATH=/workspace:/opt/fleet-live-validation:/opt/simulation-c3-3-3:/opt/simulation-c4-1:/opt/simulation-c4-2:/opt/simulation-c4-3:$$PYTHONPATH;
      exec python3 /opt/simulation-c4-4/charging_check.py

services:
  simulation:
    <<: *c4-4
  backend:
    <<: *c4-4
